site_name: MWM Kullanım Rehberi
site_description: MWM kaynak makineleri için TT / MSC barkod okuma, profil reçetesi ve iş dosyası rehberi
site_url: https://hm-info.github.io/mwm_info/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: tr
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.expand
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: blue-grey
      accent: blue-grey

nav:
  - Türkçe:
      - Başlangıç: index.md
      - Barkod Bilgi Sayfası: barcode-tr.md
      - KD658 İş Dosyası: turkish.md
  - English:
      - Getting Started: home-en.md
      - Barcode Information: barcode-en.md
      - KD658 Work File: english.md

use_directory_urls: false

plugins:
  - search

markdown_extensions:
  - md_in_html

hooks:
  - hooks/pdf_export.py
  - hooks/navigation.py

extra:
  alternate:
    - name: Türkçe
      link: index.html
      lang: tr
    - name: English
      link: home-en.html
      lang: en

extra_css:
  - stylesheets/guide.css
