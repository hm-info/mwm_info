site_name: MWM HMI Manual
site_description: MWM kaynak makineleri için TT / MSC barkod okuma, profil reçetesi ve iş dosyası rehberi
site_url: https://hm-info.github.io/mwm_info/

docs_dir: docs

theme:
  name: material
  language: tr
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: blue-grey
      accent: blue-grey

nav:
  - Ana Sayfa / Home: index.md
  - Barkod Bilgi Sayfası: barcode-tr.md
  - 🇹🇷 Türkçe: turkish.md
  - 🇬🇧 English: english.md

use_directory_urls: false

plugins:
  - search
